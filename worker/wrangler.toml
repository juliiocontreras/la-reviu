# La Reviú — Worker de Cloudflare (D1 + auth usuario/contraseña + Resend)
name = "la-reviu"
main = "worker.js"
compatibility_date = "2025-04-01"

# D1 (preferido). El database_id se rellena tras crear la base (ver README.md
# paso 1); es el UUID que devuelve `wrangler d1 create la-reviu`.
[[d1_databases]]
binding = "DB"
database_name = "la-reviu"
database_id = "e85f2197-22ce-4b98-9a7a-1d82302a9458"

[vars]
# Origen del frontend (GitHub Pages). Sin esto el navegador bloquea las
# llamadas fetch por CORS.
ALLOWED_ORIGIN = "https://la-reviu.pages.dev"

# Secretos (NUNCA aquí): RESEND_API_KEY -> `wrangler secret put <NOMBRE>`
# en este Worker. Sin Google OAuth: el acceso de administrador (usuario +
# contraseña) lo crea Julio mismo en /admin; no hay claves que configurar.
